# Runs the app's hourly job (auto-approvals and reminders). Free on GitHub Actions.
# Needs the repository secret CRON_SECRET, the same value as CRON_SECRET on Render.
name: Hourly job
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the hourly endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Add the CRON_SECRET repository secret first."; exit 1; fi
          curl -sS --fail-with-body --max-time 120 --retry 2 --retry-delay 20 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://app.thetruescholars.com/api/cron/hourly
